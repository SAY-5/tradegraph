name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  etl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv run tradegraph-etl build --sample --out build
      - run: uv run tradegraph-etl validate --sample --out build --fail-on-violation
      - uses: actions/upload-artifact@v4
        with:
          name: etl-build
          path: etl/build

  api:
    runs-on: ubuntu-latest
    needs: etl
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: etl-build
          path: etl/build
      - run: mvn -B verify
        env:
          # No sample means ExposurePerformanceIT fails here rather than skipping quietly.
          TRADEGRAPH_REQUIRE_SAMPLE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exposure-latency
          path: api/target/benchmarks/exposure-latency.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run selfcheck
      - run: npm run weight
      # The slice embeds etl/sample and queries/*.rq, so a change to either has to be
      # regenerated in the same commit rather than left to stale silently.
      - run: npm run slice
      - run: git diff --exit-code src/data/

  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
