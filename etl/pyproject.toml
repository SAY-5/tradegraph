[project]
name = "tradegraph-etl"
version = "3.0.0"
description = "ETL that builds the TradeGraph counterparty knowledge graph from SEC EDGAR data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SAY-5", email = "say.apm35@gmail.com" }]
dependencies = [
    "rdflib>=7.0",
    "httpx>=0.27",
    "click>=8.1",
]

[project.scripts]
tradegraph-etl = "tradegraph_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradegraph_etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
